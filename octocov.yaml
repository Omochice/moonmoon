coverage:
  paths:
    - _build/coverage/cobertura.xml
    - _build/coverage/keyring.xml
  exclude:
    - mcp/src/example/**
testExecutionTime:
  steps:
    - Run the unit tests with coverage
comment:
  if: is_pull_request
  updatePrevious: true
summary:
  if: true
report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
